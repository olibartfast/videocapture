name: Dependency Update Check

on:
  schedule:
    # Run weekly on Monday at 00:00 UTC
    - cron: '0 0 * * 1'
  workflow_dispatch:
    inputs:
      create_issue:
        description: Create or update the dependency issue when updates are found
        required: false
        default: false
        type: boolean

permissions:
  issues: write
  contents: read

jobs:
  check-dependencies:
    name: Check for Dependency Updates
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Read Ubuntu package candidates
      id: packages
      run: |
        set -euo pipefail
        sudo apt-get update

        candidate() {
          apt-cache policy "$1" | awk '/Candidate:/ {print $2}'
        }

        {
          echo "opencv=$(candidate libopencv-dev)"
          echo "gstreamer=$(candidate libgstreamer1.0-dev)"
          echo "ffmpeg=$(candidate libavcodec-dev)"
          echo "cmake=$(candidate cmake)"
        } >> "$GITHUB_OUTPUT"

    - name: Compare with reviewed package versions
      id: compare
      env:
        OPENCV_CANDIDATE: ${{ steps.packages.outputs.opencv }}
        GSTREAMER_CANDIDATE: ${{ steps.packages.outputs.gstreamer }}
        FFMPEG_CANDIDATE: ${{ steps.packages.outputs.ffmpeg }}
        CMAKE_CANDIDATE: ${{ steps.packages.outputs.cmake }}
      run: |
        updates_available="$(scripts/check_dependency_updates.sh \
          versions.env dependency-report.md \
          "$OPENCV_CANDIDATE" "$GSTREAMER_CANDIDATE" \
          "$FFMPEG_CANDIDATE" "$CMAKE_CANDIDATE")"
        echo "updates_available=$updates_available" >> "$GITHUB_OUTPUT"
        cat dependency-report.md

    - name: Create issue if updates available
      if: >-
        steps.compare.outputs.updates_available == 'true' &&
        (github.event_name == 'schedule' || inputs.create_issue)
      uses: actions/github-script@v9
      with:
        script: |
          const fs = require('fs');
          const marker = '<!-- videocapture-dependency-update-check -->';
          const report = fs.readFileSync('dependency-report.md', 'utf8').trim();
          const date = new Date().toISOString().split('T')[0];
          const title = `Dependency Update Check - ${date}`;
          const body = `## Dependency Update Check
          ${marker}

          ${report}

          Review the available updates. If no minimum build requirement needs to
          change, record the reviewed package versions in \`versions.env\`.

          This issue was automatically created by the dependency update check workflow.`;

          const issues = await github.paginate(github.rest.issues.listForRepo, {
            owner: context.repo.owner,
            repo: context.repo.repo,
            state: 'open',
            labels: 'dependencies',
            per_page: 100
          });

          const existingIssue = issues.find(issue =>
            !issue.pull_request &&
            (issue.body?.includes(marker) ||
             (issue.title.startsWith('Dependency Update Check') &&
              issue.labels.some(label => label.name === 'automated')))
          );

          if (existingIssue) {
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: existingIssue.number,
              title,
              body
            });
          } else {
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['dependencies', 'automated']
            });
          }
