name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-release:
    name: Build Release (${{ matrix.os }}, ${{ matrix.backend }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, macos-latest]
        backend: [opencv, all]

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Get version
      id: get_version
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          VERSION="${{ github.event.inputs.tag }}"
        else
          VERSION=${GITHUB_REF#refs/tags/}
        fi
        echo "version=${VERSION}" >> $GITHUB_OUTPUT
        echo "Version: ${VERSION}"

    - name: Install dependencies (Ubuntu)
      if: startsWith(matrix.os, 'ubuntu')
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          ninja-build \
          libopencv-dev \
          libgtest-dev \
          libcurl4-openssl-dev

    - name: Install all backends (Ubuntu)
      if: startsWith(matrix.os, 'ubuntu') && matrix.backend == 'all'
      run: |
        sudo apt-get install -y \
          libsdl2-dev \
          libgstreamer1.0-dev \
          libgstreamer-plugins-base1.0-dev \
          libgstreamer-plugins-bad1.0-dev \
          libavcodec-dev \
          libavformat-dev \
          libavutil-dev \
          libswscale-dev \
          libavdevice-dev

    - name: Install dependencies (macOS)
      if: startsWith(matrix.os, 'macos')
      run: |
        brew update
        brew install cmake ninja opencv googletest

    - name: Install all backends (macOS)
      if: startsWith(matrix.os, 'macos') && matrix.backend == 'all'
      run: |
        brew install gstreamer gst-plugins-base gst-plugins-good ffmpeg sdl2

    - name: Configure CMake (OpenCV only)
      if: matrix.backend == 'opencv'
      run: |
        cmake -B build -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DBUILD_TESTS=OFF

    - name: Configure CMake (All backends)
      if: matrix.backend == 'all'
      run: |
        cmake -B build -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DBUILD_TESTS=OFF \
          -DUSE_GSTREAMER=ON \
          -DUSE_FFMPEG=ON

    - name: Build
      run: cmake --build build --config Release

    - name: Package artifacts
      run: |
        cd build
        mkdir -p package/lib package/include package/bin
        cp -r ../include/* package/include/
        if [ -f bin/VideoCaptureApp ]; then
          cp bin/VideoCaptureApp package/bin/
        fi
        if [ -f libVideoCapture.so ]; then
          cp libVideoCapture.so package/lib/
        elif [ -f libVideoCapture.dylib ]; then
          cp libVideoCapture.dylib package/lib/
        fi
        tar -czf VideoCapture-${{ steps.get_version.outputs.version }}-${{ matrix.os }}-${{ matrix.backend }}.tar.gz package/

    - name: Create or update release and upload asset
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ steps.get_version.outputs.version }}
        name: Release ${{ steps.get_version.outputs.version }}
        draft: false
        prerelease: false
        body: |
          ## VideoCapture ${{ steps.get_version.outputs.version }}

          ### Changes
          See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/${{ steps.get_version.outputs.version }}/CHANGELOG.md) for details.

          ### Supported Backends
          - OpenCV (default)
          - GStreamer (optional)
          - FFmpeg (optional)
        files: build/VideoCapture-${{ steps.get_version.outputs.version }}-${{ matrix.os }}-${{ matrix.backend }}.tar.gz
