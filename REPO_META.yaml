name: videocapture
role: video-io

default_branches:
  integration: develop
  release: master

entrypoints:
  configure_default:
    - cmake -S . -B build
  configure_gstreamer:
    - cmake -S . -B build -DUSE_GSTREAMER=ON
  configure_ffmpeg:
    - cmake -S . -B build -DUSE_FFMPEG=ON
  build:
    - cmake --build build
  test:
    - ctest --test-dir build --output-on-failure

owned_paths:
  - .github/workflows/
  - include/
  - src/
  - app/
  - tests/
  - cmake/
  - docs/
  - scripts/
  - CMakeLists.txt
  - CHANGELOG.md
  - Dockerfile.full
  - Readme.md
  - AGENTS.md
  - REPO_META.yaml

allowed_change_classes:
  - feature-implementation
  - ci-triage
  - dependency-sync
  - io-regression-fix
  - docs-sync

forbidden_change_classes:
  - packaging-release-change
  - unapproved-large-refactor
  - unapproved-new-dependency

constraints:
  preserve_source_semantics: true
  preserve_backend_priority: true
  review_stream_behavior_changes: mandatory
  public_frame_api_dependency_free: true
  large_refactors_require_explicit_approval: true
  new_dependencies_require_explicit_approval: true
